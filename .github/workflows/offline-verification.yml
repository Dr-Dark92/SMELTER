name: SMELTER offline verification
on:
  push:
    branches: [SMELTERV1, codex/uiux-overhaul-20261021]
  pull_request:
    branches: [SMELTERV1]
permissions:
  contents: read
concurrency:
  group: smelter-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SMELTER_VISION_LIVE: "0"
      SMELTER_TEST_DOCKER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r tools/dashboard/requirements-mcp.txt
      - run: python -m unittest discover -s tools/dashboard -p "test_*.py"
      - run: python -m unittest discover -s tools/setup -p "test_*.py"
      - run: python -m unittest discover -s tools/analysis -p "test_*.py"
      - shell: bash
        run: node --test tools/dashboard/test_*.js
