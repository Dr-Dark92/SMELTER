name: SMELTER offline verification
on:
  push:
    branches: [SMELTERV1, codex/uiux-overhaul-20261021, 'codex/opencode-skills-mcp-*', 'codex/home-smoke-*', 'codex/ecc-*', 'codex/workflow-*']
    paths-ignore: ['docs/**', 'design-system/**', 'README.md', 'CHANGELOG.md']
  pull_request:
    branches: [SMELTERV1]
permissions:
  contents: read
concurrency:
  group: smelter-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-bridge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/dashboard/requirements-mcp.txt
      - name: Read the pinned ECC verification instruction fixture
        uses: actions/checkout@v4
        with:
          repository: affaan-m/ECC
          ref: 90606c8315ee09cafc303515c5f33024db6b9882
          path: .smelter/ecc-reference
          sparse-checkout: |
            skills/verification-loop
            skills/tdd-workflow
          persist-credentials: false
      - name: Verify ECC fixture bytes
        run: python -c "import hashlib;from pathlib import Path;assert hashlib.sha256(Path('.smelter/ecc-reference/skills/verification-loop/SKILL.md').read_bytes()).hexdigest()=='5b06be54d4852f60e6cf1b04c6e9a4748554334eb3e41af6c0959b544e6464ae'"
      - name: Build the explicit pinned-version OpenCode test image
        shell: bash
        run: docker build --iidfile "$RUNNER_TEMP/smelter-opencode-image" -f tools/dashboard/Dockerfile.opencode .
      - name: Prepare the explicit Python test image
        shell: bash
        run: |
          docker pull python:3.12-alpine
          docker pull node:22-alpine
      - name: Exercise both real confined coding profiles and mixed failure classification
        shell: bash
        run: |
          mkdir -p .smelter/bridge-checks
          python tools/analysis/smoke_coding_profiles.py --python-image "$(docker image inspect --format '{{.Id}}' python:3.12-alpine)" --node-image "$(docker image inspect --format '{{.Id}}' node:22-alpine)" --output .smelter/bridge-checks/profile-evidence | tee .smelter/bridge-checks/profiles.json
      - name: Exercise real OpenCode, skills, MCP and saved bytes in confinement
        shell: bash
        run: |
          mkdir -p .smelter/bridge-checks
          python tools/analysis/smoke_agent_bridge.py --image "$(cat "$RUNNER_TEMP/smelter-opencode-image")" --fixture-delay 12 --skill-manifest .smelter/ecc-reference/skills/verification-loop/SKILL.md --skill-id ecc-verification-loop --evidence-dir .smelter/bridge-checks/runtime-evidence | tee .smelter/bridge-checks/managed-smoke.json
      - name: Exercise actual frontend CSS validation and owned preview
        shell: bash
        run: |
          python tools/analysis/smoke_frontend_workspace.py --python-image "$(docker image inspect --format '{{.Id}}' python:3.12-alpine)" --node-image "$(docker image inspect --format '{{.Id}}' node:22-alpine)" --output .smelter/bridge-checks/frontend-evidence | tee .smelter/bridge-checks/frontend.json
      - name: Exercise ECC TDD through real OpenCode, MCP, code patches and isolated tests
        shell: bash
        run: |
          python tools/analysis/smoke_ecc_coding.py --image "$(cat "$RUNNER_TEMP/smelter-opencode-image")" --python-image "$(docker image inspect --format '{{.Id}}' python:3.12-alpine)" --skill-manifest .smelter/ecc-reference/skills/tdd-workflow/SKILL.md --evidence-dir .smelter/bridge-checks/coding-evidence | tee .smelter/bridge-checks/coding-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-bridge-smoke-evidence
          path: .smelter/bridge-checks
          retention-days: 14

  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SMELTER_VISION_LIVE: "0"
      SMELTER_TEST_DOCKER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r tools/dashboard/requirements-mcp.txt
      - run: python -m unittest discover -s tools/dashboard -p "test_*.py"
      - run: python -m unittest discover -s tools/setup -p "test_*.py"
      - run: python -m unittest discover -s tools/analysis -p "test_*.py"
      - run: python tools/analysis/smoke_workflows.py --output .smelter/workflow-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-smoke-${{ matrix.os }}
          path: .smelter/workflow-smoke
          retention-days: 14
      - shell: bash
        run: node --test tools/dashboard/test_*.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMELTER_VISION_LIVE: "0"
      SMELTER_TEST_DOCKER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read pinned UI UX Pro Max reference
        uses: actions/checkout@v4
        with:
          repository: nextlevelbuilder/ui-ux-pro-max-skill
          ref: 56ea9cf174ed86786187daa9de0e6247cb0747e4
          path: .smelter/design-reference
          sparse-checkout: .claude/skills/ui-ux-pro-max
          persist-credentials: false
      - name: Generate and record the design recommendation
        shell: bash
        run: |
          mkdir -p .smelter/ui-checks
          python .smelter/design-reference/.claude/skills/ui-ux-pro-max/scripts/search.py "developer tools dashboard dark" --design-system --variance 4 --motion 1 --density 8 -p SMELTER --json > .smelter/ui-checks/design-system.json
          python -c "import json;from pathlib import Path;print('SMELTER_DESIGN|'+json.dumps(json.loads(Path('.smelter/ui-checks/design-system.json').read_text())))"
      - name: Install explicit browser test dependencies
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/smelter-browser" --ignore-scripts --save-exact playwright@1.56.1
          "$RUNNER_TEMP/smelter-browser/node_modules/.bin/playwright" install --with-deps chromium
          npm install --prefix .smelter/tooling/model-viewer --ignore-scripts --save-exact @google/model-viewer@4.1.0
          echo "SMELTER_TEST_PLAYWRIGHT=$RUNNER_TEMP/smelter-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Verify real UI and GLB lifecycle without inference
        run: node tools/analysis/check_workbench_browser.mjs
      - name: Build pinned source relationships
        run: python tools/analysis/ci_graph_snapshot.py --emit-base64
      - name: Emit fixture screenshots for visual review
        if: always()
        shell: python
        run: |
          import base64
          from pathlib import Path
          for name in ('workbench-desktop.png', 'settings-locations-desktop.png', 'chat-375.png', 'system-status-desktop.png', 'system-status-375.png', 'failure.png'):
              path = Path('.smelter/ui-checks') / name
              if path.is_file():
                  print('SMELTER_PREVIEW|' + name + '|' + base64.b64encode(path.read_bytes()).decode())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-evidence
          path: .smelter/ui-checks
          retention-days: 14
